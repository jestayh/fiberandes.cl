<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 82" fill="none">
  <defs>
    <linearGradient id="fa-laser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="fa-core" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="fa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark: Optical Mountain Waveform (Andes + Fiber Waveguide) -->
  <g transform="translate(4, 2)">
    <!-- Mountain Background Glow -->
    <path d="M48 6 L88 74 L8 74 Z" fill="rgba(0,240,255,0.08)" stroke="rgba(0,240,255,0.25)" stroke-width="1.5"/>
    
    <!-- Primary Andean Peak / Optical Ridge 1 -->
    <path d="M14 74 L44 20 L64 48 L74 30 L90 74" 
          stroke="url(#fa-laser)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#fa-glow)"/>

    <!-- Inner Core Waveguide -->
    <path d="M24 74 L44 32 L60 56 L74 40 L84 74" 
          stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- Light Pulse Nodes (Rayleigh backscattering points) -->
    <circle cx="44" cy="20" r="4" fill="#FFFFFF" filter="url(#fa-glow)"/>
    <circle cx="74" cy="30" r="3.5" fill="#00FFA3" filter="url(#fa-glow)"/>
    <circle cx="60" cy="56" r="3" fill="#00F0FF"/>
    
    <!-- Optical Fiber Base Line -->
    <line x1="2" y1="74" x2="98" y2="74" stroke="url(#fa-laser)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="6" cy="74" r="3.5" fill="#00F0FF"/>
    <circle cx="98" cy="74" r="3.5" fill="#00FFA3"/>
  </g>

  <!-- Typography: High legibility and contrast -->
  <!-- Both lines share textLength so they render the same width whatever font the viewer has. -->
  <text x="115" y="45" textLength="290" lengthAdjust="spacing" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="800" font-size="43" fill="#FFFFFF">FIBER<tspan fill="url(#fa-laser)">ANDES</tspan></text>
  <text x="115" y="73" textLength="290" lengthAdjust="spacing" font-family="'JetBrains Mono', 'Space Grotesk', monospace" font-size="16" font-weight="800" fill="#00F0FF">DISTRIBUTED SENSING &#183; CHILE</text>
</svg>
