<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" fill="none">
  <defs>
    <linearGradient id="fa-laser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="fa-core" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="fa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark: Optical Mountain Waveform (Andes + Fiber Waveguide) -->
  <g transform="translate(10, 10)">
    <!-- Shield / Mountain background glow -->
    <path d="M45 5 L85 75 L5 75 Z" fill="rgba(0,240,255,0.06)" stroke="rgba(0,240,255,0.2)" stroke-width="1.5"/>
    
    <!-- Primary Andean Peak / Optical Ridge 1 -->
    <path d="M12 75 L42 22 L62 50 L72 32 L88 75" 
          stroke="url(#fa-laser)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#fa-glow)"/>

    <!-- Inner Core Waveguide -->
    <path d="M22 75 L42 35 L58 58 L72 42 L82 75" 
          stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Light Pulse Nodes (Rayleigh/Brillouin backscattering points) -->
    <circle cx="42" cy="22" r="3.5" fill="#FFFFFF" filter="url(#fa-glow)"/>
    <circle cx="72" cy="32" r="3" fill="#00FFA3" filter="url(#fa-glow)"/>
    <circle cx="58" cy="58" r="2.5" fill="#00F0FF"/>
    
    <!-- Optical Fiber Base Line -->
    <line x1="0" y1="75" x2="95" y2="75" stroke="url(#fa-laser)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="4" cy="75" r="3" fill="#00F0FF"/>
    <circle cx="95" cy="75" r="3" fill="#00FFA3"/>
  </g>

  <!-- Typography -->
  <text x="125" y="58" font-family="'Space Grotesk', 'Outfit', sans-serif" font-weight="700" font-size="40" letter-spacing="1.5" fill="#FFFFFF">
    FIBER<tspan fill="url(#fa-laser)">ANDES</tspan>
  </text>
  <text x="128" y="82" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" letter-spacing="3.5" fill="#7E92B0">
    DISTRIBUTED SENSING · CHILE
  </text>
</svg>
